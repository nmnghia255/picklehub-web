      .text { fill: #e6edf3; font-family: Inter, Arial, sans-serif; font-size:16px }
      .muted { fill: #9aa4b2; }
      .button { fill: #0b1220; stroke: #374151; stroke-width:1; rx:6; }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%" rx="8" />
  <g transform="translate(16,16)">
    <rect class="card" width="768" height="48" rx="8" />
    <g transform="translate(12,8)">
      <rect class="select" width="120" height="32" rx="6" />
      <text class="text" x="16" y="20">Tháng 5 ▾</text>
    </g>
    <g transform="translate(148,8)">
      <rect class="select" width="88" height="32" rx="6" />
      <text class="text" x="16" y="20">2026 ▾</text>
    </g>
    <g transform="translate(256,8)">
      <rect class="button" width="96" height="32" rx="6" />
